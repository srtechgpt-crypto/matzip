<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>맛집지도</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <form class="bar" id="searchForm" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" placeholder="동네 검색 (예: 대구 동성로)">
    <button class="main" type="submit">검색</button>
    <button type="button" id="mine">📍내 위치</button>
  </form>
  <div class="cands" id="cands" hidden></div>
  <div class="base" id="base">기준: 위치 확인 중…</div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="map"></div>
  <section id="side">
    <div class="st" id="status"></div>
    <div id="list"></div>
    <p class="foot" id="foot"></p>
  </section>
</main>
<script src="config.js"></script>
<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
